<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Downloader</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #ff3d3d;
    --accent-hover: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2030, var(--bg));
    color: var(--text);
    padding: 24px;
  }
  .app { width: 100%; max-width: 560px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.92rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  .row { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    background: #12151b;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .result { margin-top: 20px; display: none; }
  .result.show { display: block; }
  .meta { display: flex; gap: 14px; align-items: flex-start; }
  .thumb {
    width: 140px;
    border-radius: 10px;
    flex-shrink: 0;
    background: #000;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }
  .meta h2 { font-size: 1rem; margin: 0 0 6px; line-height: 1.35; }
  .meta p { margin: 2px 0; color: var(--muted); font-size: 0.85rem; }
  .controls { margin-top: 18px; display: flex; gap: 10px; }
  select {
    flex: 1;
    background: #12151b;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  .error {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(255, 61, 61, 0.12);
    border: 1px solid rgba(255, 61, 61, 0.4);
    color: #ffb3b3;
    font-size: 0.88rem;
  }
  .error.show { display: block; }
  .status { margin-top: 12px; color: var(--muted); font-size: 0.85rem; min-height: 1.2em; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid var(--muted);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="app">
    <h1>YouTube <span>Downloader</span></h1>
    <p class="sub">Paste a video link, choose a quality, and download.</p>

    <div class="card">
      <div class="row">
        <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." />
        <button id="fetch">Fetch</button>
      </div>
      <div class="status" id="status"></div>
      <div class="error" id="error"></div>

      <div class="result" id="result">
        <div class="meta">
          <img class="thumb" id="thumb" alt="thumbnail" />
          <div>
            <h2 id="title"></h2>
            <p id="uploader"></p>
            <p id="duration"></p>
          </div>
        </div>
        <div class="controls">
          <select id="quality">
            <option value="best">Best available</option>
            <option value="1080p">1080p (MP4)</option>
            <option value="720p">720p (MP4)</option>
            <option value="480p">480p (MP4)</option>
            <option value="360p">360p (MP4)</option>
            <option value="audio">Audio only (MP3)</option>
          </select>
          <button id="download">Download</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const errorEl = $("error");

  function setError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.toggle("show", Boolean(msg));
  }
  function setStatus(html) { statusEl.innerHTML = html || ""; }
  function fmtDuration(sec) {
    if (!sec) return "";
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return h
      ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`
      : `${m}:${String(s).padStart(2, "0")}`;
  }

  $("fetch").addEventListener("click", async () => {
    const url = $("url").value.trim();
    setError("");
    $("result").classList.remove("show");
    if (!url) return setError("Paste a YouTube URL first.");

    $("fetch").disabled = true;
    setStatus('<span class="spinner"></span>Looking up video...');
    try {
      const res = await fetch("/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Failed to fetch video.");

      $("title").textContent = data.title || "Unknown title";
      $("uploader").textContent = data.uploader ? `Channel: ${data.uploader}` : "";
      $("duration").textContent = data.duration ? `Length: ${fmtDuration(data.duration)}` : "";
      $("thumb").src = data.thumbnail || "";
      $("result").classList.add("show");
      setStatus("");
    } catch (err) {
      setError(err.message);
      setStatus("");
    } finally {
      $("fetch").disabled = false;
    }
  });

  $("url").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("fetch").click();
  });

  $("download").addEventListener("click", () => {
    const url = $("url").value.trim();
    const quality = $("quality").value;
    if (!url) return setError("Paste a YouTube URL first.");
    setError("");
    setStatus('<span class="spinner"></span>Preparing download... this can take a moment.');
    const link = document.createElement("a");
    link.href = `/api/download?url=${encodeURIComponent(url)}&quality=${encodeURIComponent(quality)}`;
    link.download = "";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => setStatus("Download started. Check your browser downloads."), 2500);
  });
</script>
</body>
</html>
